services:
  verde-crm:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3210
      DATABASE_PATH: /app/data/whatscrm.db
    ports:
      - "127.0.0.1:${PUBLIC_PORT:-3210}:3210"
    volumes:
      - crm_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  crm_data:
